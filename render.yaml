services:
  - type: web
    name: finsight-api
    env: python
    region: singapore          # closest free region for India
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: GEMINI_API_KEY
        sync: false            # Render will prompt you to fill this in the dashboard
      - key: OPENAI_API_KEY
        sync: false            # Optional — fill in one of the two keys
