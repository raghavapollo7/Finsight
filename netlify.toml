[build]
  publish = "."          # Deploy entire Finsight root folder as static site

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=()"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-store"     # Always fresh — so URL changes take effect immediately
